name: Test, scan and publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Static checks
        run: npm run check
      - name: Tests
        run: npm test

  build-scan-publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      MCP_IMAGE: ghcr.io/${{ github.repository }}
      GATEWAY_IMAGE: ghcr.io/${{ github.repository }}-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build MCP locally for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: mcp-runtime
          load: true
          tags: vps-observer-mcp:scan
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
      - name: Scan MCP image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vps-observer-mcp:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Build gateway locally for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: gateway-runtime
          load: true
          tags: vps-observer-gateway:scan
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Scan gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vps-observer-gateway:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish MCP image with SBOM and provenance
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: mcp-runtime
          push: true
          tags: |
            ${{ env.MCP_IMAGE }}:${{ github.sha }}
            ${{ env.MCP_IMAGE }}:latest
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=mcp
      - name: Publish gateway image with SBOM and provenance
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: gateway-runtime
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ github.sha }}
            ${{ env.GATEWAY_IMAGE }}:latest
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=gateway
