name: ${COMPOSE_PROJECT_NAME:-mcp}

services:
  docker-proxy:
    image: ${DOCKER_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459}
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "0"
      INFO: "0"
      POST: "0"
      VERSION: "0"
      AUTH: "0"
      SECRETS: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      IMAGES: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    expose:
      - "${DOCKER_PROXY_PORT:-2375}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-raw
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,size=4m
      - /tmp:rw,nosuid,nodev,noexec,size=4m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${DOCKER_PROXY_MEM_LIMIT:-64m}
    cpus: ${DOCKER_PROXY_CPUS:-0.25}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"

  docker-gateway:
    image: ${GATEWAY_IMAGE:-vps-observer-gateway:local}
    build:
      context: .
      target: gateway-runtime
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: ${GATEWAY_SERVICE_NAME:-docker-read-gateway}
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL:-http://docker-proxy:2375}
      ALLOWED_CONTAINERS: ${ALLOWED_CONTAINERS:?ALLOWED_CONTAINERS is required}
      ENABLE_DOCKER_LOGS: ${ENABLE_DOCKER_LOGS:-false}
      MAX_LOG_BYTES: ${MAX_LOG_BYTES:-131072}
      MAX_DOCKER_JSON_BYTES: ${MAX_DOCKER_JSON_BYTES:-1048576}
      DOCKER_TIMEOUT_MS: ${DOCKER_TIMEOUT_MS:-8000}
    expose:
      - "${GATEWAY_PORT:-8080}"
    networks:
      - docker-raw
      - docker-observe
    depends_on:
      - docker-proxy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${GATEWAY_PIDS_LIMIT:-64}
    mem_limit: ${GATEWAY_MEM_LIMIT:-128m}
    cpus: ${GATEWAY_CPUS:-0.50}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"

  mcp:
    image: ${MCP_IMAGE:-vps-observer-mcp:local}
    build:
      context: .
      target: mcp-runtime
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: ${SERVICE_NAME:-vps-observer-mcp}
      PORT: ${MCP_PORT:-3000}
      AUTH_TOKEN_SHA256: ${AUTH_TOKEN_SHA256:?AUTH_TOKEN_SHA256 is required}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-${MCP_DOMAIN:?MCP_DOMAIN is required}}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      DOCKER_GATEWAY_URL: ${DOCKER_GATEWAY_URL:-http://docker-gateway:${GATEWAY_PORT:-8080}}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-64kb}
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-10000}
      MAX_GATEWAY_RESPONSE_BYTES: ${MAX_GATEWAY_RESPONSE_BYTES:-524288}
      ENABLE_DOCKER_LOGS: ${ENABLE_DOCKER_LOGS:-false}
      ENABLE_OPS_TOOLS: ${ENABLE_OPS_TOOLS:-false}
      OPS_ALLOWLIST_PATH: ${OPS_ALLOWLIST_PATH:-/app/ops-allowlist.json}
      OPS_MAX_OUTPUT_BYTES: ${OPS_MAX_OUTPUT_BYTES:-1048576}
    expose:
      - "${MCP_PORT:-3000}"
    networks:
      - docker-observe
      - web
    depends_on:
      docker-gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${MCP_PIDS_LIMIT:-128}
    mem_limit: ${MCP_MEM_LIMIT:-512m}
    cpus: ${MCP_CPUS:-1.00}
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    labels:
      traefik.enable: "${TRAEFIK_ENABLE:-true}"
      traefik.docker.network: ${TRAEFIK_NETWORK:-web}
      traefik.http.routers.mcp.rule: Host(`${MCP_DOMAIN:?MCP_DOMAIN is required}`) && Path(`/mcp`)
      traefik.http.routers.mcp.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.mcp.tls: "true"
      traefik.http.routers.mcp.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.mcp.service: mcp
      traefik.http.routers.mcp.middlewares: mcp-security-headers,mcp-rate-limit
      traefik.http.services.mcp.loadbalancer.server.port: "${MCP_PORT:-3000}"
      traefik.http.middlewares.mcp-rate-limit.ratelimit.average: "${TRAEFIK_RATE_AVERAGE:-10}"
      traefik.http.middlewares.mcp-rate-limit.ratelimit.burst: "${TRAEFIK_RATE_BURST:-20}"
      traefik.http.middlewares.mcp-rate-limit.ratelimit.period: 1s
      traefik.http.middlewares.mcp-security-headers.headers.contenttypenosniff: "true"
      traefik.http.middlewares.mcp-security-headers.headers.framedeny: "true"
      traefik.http.middlewares.mcp-security-headers.headers.referrerpolicy: no-referrer
      traefik.http.middlewares.mcp-security-headers.headers.stsseconds: "${TRAEFIK_STS_SECONDS:-31536000}"

networks:
  docker-raw:
    internal: true
  docker-observe:
    internal: true
  web:
    external: true
    name: ${TRAEFIK_NETWORK:-web}
