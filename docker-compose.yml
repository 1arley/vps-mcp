name: ${COMPOSE_PROJECT_NAME:-mcp}

services:
  mcp:
    image: ${MCP_IMAGE:-vps-observer-mcp:local}
    build:
      context: .
      target: mcp-runtime
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: ${SERVICE_NAME:-vps-observer-mcp}
      PORT: ${MCP_PORT:-3000}
      AUTH_TOKEN_SHA256: ${AUTH_TOKEN_SHA256:?AUTH_TOKEN_SHA256 is required}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-${MCP_DOMAIN:?MCP_DOMAIN is required}}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      DOCKER_SOCKET_PATH: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
      DOCKER_TIMEOUT_MS: ${DOCKER_TIMEOUT_MS:-8000}
      MAX_DOCKER_BYTES: ${MAX_DOCKER_BYTES:-1048576}
      OPS_ALLOWLIST_PATH: ${OPS_ALLOWLIST_PATH:-/app/ops-allowlist.json}
      OPS_MAX_OUTPUT_BYTES: ${OPS_MAX_OUTPUT_BYTES:-1048576}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-64kb}
      PG_HOST: ${PG_HOST:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-}
    expose:
      - "${MCP_PORT:-3000}"
    networks:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ops-allowlist.json:/app/ops-allowlist.json:ro
      - /srv:/srv:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${MCP_PIDS_LIMIT:-128}
    mem_limit: ${MCP_MEM_LIMIT:-512m}
    cpus: ${MCP_CPUS:-1.00}
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    labels:
      traefik.enable: "${TRAEFIK_ENABLE:-true}"
      traefik.docker.network: ${TRAEFIK_NETWORK:-web}
      traefik.http.routers.mcp.rule: Host(`${MCP_DOMAIN:?MCP_DOMAIN is required}`) && Path(`/mcp`)
      traefik.http.routers.mcp.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.mcp.tls: "true"
      traefik.http.routers.mcp.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.mcp.service: mcp
      traefik.http.routers.mcp.middlewares: mcp-security-headers,mcp-rate-limit
      traefik.http.services.mcp.loadbalancer.server.port: "${MCP_PORT:-3000}"
      traefik.http.middlewares.mcp-rate-limit.ratelimit.average: "${TRAEFIK_RATE_AVERAGE:-10}"
      traefik.http.middlewares.mcp-rate-limit.ratelimit.burst: "${TRAEFIK_RATE_BURST:-20}"
      traefik.http.middlewares.mcp-rate-limit.ratelimit.period: 1s
      traefik.http.middlewares.mcp-security-headers.headers.contenttypenosniff: "true"
      traefik.http.middlewares.mcp-security-headers.headers.framedeny: "true"
      traefik.http.middlewares.mcp-security-headers.headers.referrerpolicy: no-referrer
      traefik.http.middlewares.mcp-security-headers.headers.stsseconds: "${TRAEFIK_STS_SECONDS:-31536000}"

networks:
  web:
    external: true
    name: ${TRAEFIK_NETWORK:-web}
